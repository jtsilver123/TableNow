name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages.
# Runs on the default branch, on this preview branch, or on demand.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # basePath must match the Pages sub-path (https://<owner>.github.io/<repo>/),
        # so derive it from the repo name automatically.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_USE_SUPABASE: ${{ vars.NEXT_PUBLIC_USE_SUPABASE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_USE_LIVE_AVAILABILITY: ${{ vars.NEXT_PUBLIC_USE_LIVE_AVAILABILITY }}
          NEXT_PUBLIC_AVAILABILITY_API_URL: ${{ vars.NEXT_PUBLIC_AVAILABILITY_API_URL }}
          NEXT_PUBLIC_AVAILABILITY_API_KEY: ${{ secrets.NEXT_PUBLIC_AVAILABILITY_API_KEY }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
